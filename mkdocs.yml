site_name: tteso-agents-opentes
site_description: Documentação técnica dos agentes do mercado transativo do OpenTES (time TTESO) sobre o PADE 3.0, e dos exemplos da plataforma
site_url: "https://grei-ufc.github.io/tteso-agents-opentes/"
repo_url: "https://github.com/grei-ufc/tteso-agents-opentes"
edit_uri: "edit/main/docs/"

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/grei-colors.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables
  - def_list

plugins:
  - search
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true
  - mkdocstrings:
      handlers:
        python:
          paths: [agentes]
          options:
            docstring_style: google
            # As docstrings do projeto nao anotam tipos nas secoes Args/Returns;
            # sem isto, o build --strict falha por aviso de estilo, nao de conteudo.
            docstring_options:
              warnings: false
            show_source: true
            show_root_heading: true
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            members_order: source

extra:
  social:
    - icon: fontawesome/brands/github
      link: "https://github.com/grei-ufc/tteso-agents-opentes"

nav:
  - Início: index.md
  - Primeiros Passos:
      - getting-started/installation.md
      - getting-started/first-negotiation.md
  - Tutoriais:
      - tutorials/first-pade-agents.md
      - tutorials/negotiation-with-losses.md
  - Guias:
      - how-to-guides/run-pade-examples.md
      - how-to-guides/read-pade-logs.md
      - how-to-guides/migration-guide.md
      - how-to-guides/use-in-co-simulation.md
  - Referência:
      - reference/agents-and-protocols.md
      - reference/environment-variables.md
      - reference/examples.md
      - reference/pade-cli.md
      - reference/output-files.md
      - API (gerada):
          - reference/api/index.md
          - reference/api/market-agents.md
          - reference/api/network-link.md
          - reference/api/isolated-negotiation.md
  - Conceitos:
      - explanation/pade-update.md
      - explanation/negotiation-sequence.md
      - explanation/network-layer.md
  - Contribuir:
      - contributing/development-setup.md
      - contributing/documentation.md
  - Changelog: changelog.md
  - Citação: citation.md
  - Licença: license.md
